[project]
name = "flood-warning-project"
version = "0.1.0"
description = "Egypt Flash Flood Early Warning System - DEPI Graduation Project"
requires-python = ">=3.11,<3.12"

dependencies = [
    "requests>=2.31",
    "kafka-python>=2.0.2",
    "pandas>=2.2,<3.0",

    "pyspark>=3.5,<4.0",

    "pyodbc>=5.1",
    "sqlalchemy>=2.0",

    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "joblib>=1.3",

    "langchain>=0.2",
    "langchain-community>=0.2",
    "chromadb>=0.5",

    "fastapi>=0.111",
    "uvicorn>=0.30",

    "streamlit>=1.35",
    "plotly>=5.22",
]

[tool.uv]
python-preference = "only-managed"