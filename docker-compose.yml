services:
  kafka:
    image: apache/kafka:4.1.2
    container_name: kafka
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  airflow-db:
    image: postgres:16-alpine
    container_name: airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  airflow:
    build: .
    container_name: airflow
    command: bash -c "rm -f /opt/airflow/airflow-webserver*.pid && exec airflow standalone"
    depends_on:
      airflow-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - AIRFLOW_HOME=/opt/airflow
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT=600
      - AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT=600
      - AIRFLOW__WEBSERVER__WORKERS=2
      - PROJECT_DIR=/opt/airflow/project
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SQLSERVER_HOST=host.docker.internal
      - UV_PROJECT_ENVIRONMENT=/opt/uv-venv
      - UV_HTTP_TIMEOUT=600
      - UV_LINK_MODE=copy
    volumes:
      - airflow-data:/opt/airflow
      - ./orchestration/dags:/opt/airflow/dags
      - ./:/opt/airflow/project
      - uv-venv:/opt/uv-venv
      - /opt/airflow/project/.venv

volumes:
  airflow-data:
  airflow-pg:
  uv-venv: